[project]
name = "mobileproxy"
version = "0.1.0"
description = "Editing HTTP(S) proxy with web UI and MCP for testing the SAMO / LIDS Mobile Android app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mitmproxy>=12.1,<13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=2.3,<3",
    "jsonpath-ng>=1.6",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mobileproxy = "mobileproxy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mobileproxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
